[project]
name = "moss-ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "gradio>=6.14.0",
    "matplotlib>=3.10.9",
    "pip>=26.1.1",
    "prettytable>=3.17.0",
    "transformers==4.57.6",
    "vllm==0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
